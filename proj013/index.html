<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link css -->
     <link rel="stylesheet" href="estilos/geral.css" media="all">
     <link rel="stylesheet" href="estilos/header.css">
     <link rel="stylesheet" href="estilos/filter.css">
     <link rel="stylesheet" href="estilos/grid.css">
    <title>Escolha um País</title>
</head>
<body>
    <header>
        <div class="interface">
            <div class="logo">
                <h1>Em qual parte do Mundo</h1>
            </div>

            <button class="btn-theme">
                <i class="fa-solid fa-moon"></i>
                <p>Tema Escuro</p>
            </button>
        </div>
    </header>

    <section id="filter">
        <div class="interface">
            <div class="search-filter">
                <label for="input-seach">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </label>

                <input type="text" name="input-search" id="input-seach" placeholder="Pesquise por um país...">
            </div>

            <div class="region-filter">
                <select name="region" id="region">
                    <option selected disabled>Filtre por Região</option>
                    <option value="Todos">Todos</option>
                    <option value="Americas">Americas</option>
                    <option value="Europa">Europa</option>
                    <option value="Asia">Asia</option>
                </select>
            </div>
        </div>
    </section>

    <section id="country-container">
        <div class="interface">
            <!-- Cards JS -->
        </div>
    </section>

    <script src="js/app.js" type="module"></script>
    <script src="js/dark-theme.js"></script>
</body>
</html>

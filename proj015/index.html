<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link css -->
    <link rel="stylesheet" href="estilos/geral.css" media="all">
    <link rel="stylesheet" href="estilos/header.css">
    <link rel="stylesheet" href="estilos/main.css">

    <title>Movie Master</title>
</head>

<body>
    <header>
        <h1>Movie Master</h1>
    </header>

    <div class="interface">
        <h1>Faça sua Pesquisa</h1>
    </div>

    <main>
        <div class="interface">
            <section id="grid-container">

                <div class="left-grid">
                    <ul class="filter-container">
                        <div class="filter">
                            <div class="filter-icon">
                                <i class="fa-solid fa-filter"></i>
                                Filter
                            </div>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <li class="dropdown-filter">
                            <ul class="gender">
                                <p>Gender</p>
                                <i class="fa-solid fa-chevron-down"></i>
                            </ul>

                            <div class="gender-categories">
                                <div class="gender-input">
                                    <input type="checkbox" name="check" id="check">
                                    <p>Ação</p>
                                </div>

                                <div class="gender-input">
                                    <input type="checkbox" name="check" id="check">
                                    <p>Aventura</p>
                                </div>

                                <div class="gender-input">
                                    <input type="checkbox" name="check" id="check">
                                    <p>Comedia</p>
                                </div>

                                <div class="gender-input">
                                    <input type="checkbox" name="check" id="check">
                                    <p>Terror</p>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="right-grid">
                    <div class="search-container">
                        <div class="search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" name="search-input" id="search-input" placeholder="Pesquise aqui...">
                        </div>

                        <button class="search-btn">
                            Pesquise
                        </button>
                    </div>

                    <div class="movie-container">
                        <!-- CARDS JS -->
                    </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
